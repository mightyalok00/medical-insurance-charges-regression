<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="title desc">
<title id="title">Decision Tree Regression — Medical Insurance Charges Project</title>
<desc id="desc">Simplified educational decision tree showing decision nodes, yes/no branches, and predicted insurance charge leaf nodes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fbff"/>
    <stop offset="100%" stop-color="#eef7f3"/>
  </linearGradient>
  <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eaf4ff"/>
    <stop offset="100%" stop-color="#dcecff"/>
  </linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#effbea"/>
    <stop offset="100%" stop-color="#dff5d7"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#173b64" flood-opacity=".12"/>
  </filter>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#123b73}
    .subtitle{font:22px Arial,sans-serif;fill:#50657c}
    .nodeText{font:700 24px Arial,sans-serif;fill:#103d75}
    .small{font:18px Arial,sans-serif;fill:#4d6380}
    .branch{font:700 18px Arial,sans-serif}
    .leafText{font:700 20px Arial,sans-serif;fill:#174f37}
    .leafVal{font:700 24px Arial,sans-serif;fill:#0d3f2b}
    .legendTitle{font:700 25px Arial,sans-serif;fill:#153e73}
    .legendText{font:17px Arial,sans-serif;fill:#304a68}
    .footer{font:16px Arial,sans-serif;fill:#58708d}
  </style>
</defs>

<rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
<text x="60" y="70" class="title">Decision Tree Regression — Medical Insurance Charges Project</text>
<text x="60" y="108" class="subtitle">Illustrative tree structure showing branches, decision nodes, and leaf predictions</text>
<line x1="60" y1="132" x2="1540" y2="132" stroke="#7db8ef" stroke-width="3"/>

<!-- Root -->
<rect x="535" y="165" width="350" height="98" rx="20" fill="url(#node)" stroke="#2d86da" stroke-width="3" filter="url(#shadow)"/>
<text x="710" y="207" text-anchor="middle" class="nodeText">Smoker?</text>
<text x="710" y="238" text-anchor="middle" class="small">(Yes / No)</text>

<!-- Root branches -->
<path d="M650 263 V310 H390 V350" fill="none" stroke="#2f9654" stroke-width="5"/>
<path d="M770 263 V310 H980 V350" fill="none" stroke="#287bc4" stroke-width="5"/>
<rect x="480" y="292" width="68" height="36" rx="12" fill="#dff5d7"/><text x="514" y="316" text-anchor="middle" class="branch" fill="#21713d">Yes</text>
<rect x="870" y="292" width="62" height="36" rx="12" fill="#dcecff"/><text x="901" y="316" text-anchor="middle" class="branch" fill="#1d5f9a">No</text>

<!-- Left decision -->
<rect x="230" y="350" width="320" height="92" rx="18" fill="url(#node)" stroke="#2d86da" stroke-width="3" filter="url(#shadow)"/>
<text x="390" y="389" text-anchor="middle" class="nodeText">BMI &gt; 30?</text>
<text x="390" y="419" text-anchor="middle" class="small">(Yes / No)</text>

<!-- Right decision -->
<rect x="820" y="350" width="320" height="92" rx="18" fill="url(#node)" stroke="#2d86da" stroke-width="3" filter="url(#shadow)"/>
<text x="980" y="389" text-anchor="middle" class="nodeText">Age &gt; 45?</text>
<text x="980" y="419" text-anchor="middle" class="small">(Yes / No)</text>

<!-- Left leaves branches -->
<path d="M330 442 V500 H180 V550" fill="none" stroke="#2f9654" stroke-width="5"/>
<path d="M450 442 V500 H500 V550" fill="none" stroke="#287bc4" stroke-width="5"/>
<rect x="220" y="482" width="66" height="34" rx="11" fill="#dff5d7"/><text x="253" y="505" text-anchor="middle" class="branch" fill="#21713d">Yes</text>
<rect x="450" y="482" width="58" height="34" rx="11" fill="#dcecff"/><text x="479" y="505" text-anchor="middle" class="branch" fill="#1d5f9a">No</text>

<rect x="60" y="550" width="250" height="125" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3" filter="url(#shadow)"/>
<text x="185" y="590" text-anchor="middle" class="leafText">High Predicted Charges</text>
<text x="185" y="630" text-anchor="middle" class="leafVal">≈ $35,000+</text>

<rect x="360" y="550" width="280" height="125" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3" filter="url(#shadow)"/>
<text x="500" y="590" text-anchor="middle" class="leafText">Moderately High Charges</text>
<text x="500" y="630" text-anchor="middle" class="leafVal">≈ $28,000</text>

<!-- Right second level -->
<path d="M920 442 V500 H760 V550" fill="none" stroke="#2f9654" stroke-width="5"/>
<path d="M1040 442 V500 H1180 V550" fill="none" stroke="#287bc4" stroke-width="5"/>
<rect x="850" y="482" width="66" height="34" rx="11" fill="#dff5d7"/><text x="883" y="505" text-anchor="middle" class="branch" fill="#21713d">Yes</text>
<rect x="1085" y="482" width="58" height="34" rx="11" fill="#dcecff"/><text x="1114" y="505" text-anchor="middle" class="branch" fill="#1d5f9a">No</text>

<rect x="650" y="550" width="270" height="90" rx="18" fill="url(#node)" stroke="#2d86da" stroke-width="3" filter="url(#shadow)"/>
<text x="785" y="587" text-anchor="middle" class="nodeText">BMI &gt; 27?</text>
<text x="785" y="617" text-anchor="middle" class="small">(Yes / No)</text>

<rect x="1045" y="550" width="290" height="90" rx="18" fill="url(#node)" stroke="#2d86da" stroke-width="3" filter="url(#shadow)"/>
<text x="1190" y="587" text-anchor="middle" class="nodeText">Children &gt; 1?</text>
<text x="1190" y="617" text-anchor="middle" class="small">(Yes / No)</text>

<!-- Bottom branches -->
<path d="M735 640 V700 H680 V745" fill="none" stroke="#2f9654" stroke-width="5"/>
<path d="M835 640 V700 H900 V745" fill="none" stroke="#287bc4" stroke-width="5"/>
<path d="M1140 640 V700 H1110 V745" fill="none" stroke="#2f9654" stroke-width="5"/>
<path d="M1240 640 V700 H1350 V745" fill="none" stroke="#287bc4" stroke-width="5"/>

<rect x="650" y="687" width="60" height="32" rx="10" fill="#dff5d7"/><text x="680" y="709" text-anchor="middle" class="branch" fill="#21713d">Yes</text>
<rect x="868" y="687" width="54" height="32" rx="10" fill="#dcecff"/><text x="895" y="709" text-anchor="middle" class="branch" fill="#1d5f9a">No</text>
<rect x="1080" y="687" width="60" height="32" rx="10" fill="#dff5d7"/><text x="1110" y="709" text-anchor="middle" class="branch" fill="#21713d">Yes</text>
<rect x="1322" y="687" width="54" height="32" rx="10" fill="#dcecff"/><text x="1349" y="709" text-anchor="middle" class="branch" fill="#1d5f9a">No</text>

<rect x="580" y="745" width="200" height="115" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3"/>
<text x="680" y="787" text-anchor="middle" class="leafText">Mid Charges</text>
<text x="680" y="826" text-anchor="middle" class="leafVal">≈ $16,000</text>

<rect x="800" y="745" width="200" height="115" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3"/>
<text x="900" y="780" text-anchor="middle" class="leafText">Lower Mid</text>
<text x="900" y="807" text-anchor="middle" class="leafText">Charges</text>
<text x="900" y="837" text-anchor="middle" class="leafVal">≈ $11,000</text>

<rect x="1010" y="745" width="200" height="115" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3"/>
<text x="1110" y="787" text-anchor="middle" class="leafText">Lower Charges</text>
<text x="1110" y="826" text-anchor="middle" class="leafVal">≈ $8,000</text>

<rect x="1250" y="745" width="220" height="115" rx="18" fill="url(#leaf)" stroke="#78bf66" stroke-width="3"/>
<text x="1360" y="787" text-anchor="middle" class="leafText">Lowest Charges</text>
<text x="1360" y="826" text-anchor="middle" class="leafVal">≈ $5,000</text>

<!-- Legend -->
<rect x="1180" y="160" width="350" height="310" rx="20" fill="#ffffff" fill-opacity=".82" stroke="#9dcaf2" stroke-width="2"/>
<text x="1210" y="205" class="legendTitle">How to Read This Tree</text>
<circle cx="1225" cy="250" r="19" fill="#3f91df"/><text x="1225" y="257" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">1</text>
<text x="1260" y="245" class="legendText">Decision nodes split data</text><text x="1260" y="270" class="legendText">using feature-based rules</text>
<circle cx="1225" cy="315" r="19" fill="#62b56a"/><text x="1225" y="322" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">2</text>
<text x="1260" y="320" class="legendText">Branches represent Yes / No paths</text>
<circle cx="1225" cy="370" r="19" fill="#f19a44"/><text x="1225" y="377" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">3</text>
<text x="1260" y="365" class="legendText">Leaf nodes show final predicted</text><text x="1260" y="390" class="legendText">charge ranges</text>
<circle cx="1225" cy="430" r="19" fill="#9363c4"/><text x="1225" y="437" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">4</text>
<text x="1260" y="425" class="legendText">Smoking, BMI, age &amp; children</text><text x="1260" y="450" class="legendText">illustrate common split drivers</text>

<!-- Footer -->
<rect x="60" y="900" width="1480" height="62" rx="18" fill="#e8f2fb"/>
<text x="90" y="938" class="footer">Simplified visual explanation for the repository. It illustrates branches and leaves and does not claim to reproduce every exact split in the trained model.</text>
</svg>